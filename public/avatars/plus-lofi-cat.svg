<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="lofi-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="60%" stop-color="#241b14"/>
      <stop offset="100%" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="cat-fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="headphone-band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9abca9"/>
      <stop offset="50%" stop-color="#85aa9b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cozy-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes ear-twitch-left {
      0%, 85%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(-8deg); }
      92% { transform: rotate(4deg); }
      95% { transform: rotate(-3deg); }
    }
    @keyframes ear-twitch-right {
      0%, 80%, 100% { transform: rotate(0deg); }
      83% { transform: rotate(8deg); }
      87% { transform: rotate(-4deg); }
      90% { transform: rotate(2deg); }
    }
    @keyframes steam-rise-1 {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      30% { opacity: 0.7; }
      80% { opacity: 0.2; }
      100% { transform: translateY(-16px) scaleX(1.4); opacity: 0; }
    }
    @keyframes steam-rise-2 {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      35% { opacity: 0.7; }
      85% { opacity: 0.2; }
      100% { transform: translateY(-18px) scaleX(1.3); opacity: 0; }
    }
    @keyframes eq-bar {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    @keyframes cat-breathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .left-ear { transform-origin: 55px 56px; animation: ear-twitch-left 10.8s ease-in-out infinite; }
    .right-ear { transform-origin: 105px 56px; animation: ear-twitch-right 10.8s ease-in-out infinite 1.5s; }
    .steam-1 { animation: steam-rise-1 6s ease-out infinite; }
    .steam-2 { animation: steam-rise-2 6.12s ease-out infinite 1.2s; }
    .eq-1 { transform-origin: 27px 75px; animation: eq-bar 6s ease-in-out infinite; }
    .eq-2 { transform-origin: 30px 75px; animation: eq-bar 6s ease-in-out infinite 0.3s; }
    .eq-3 { transform-origin: 33px 75px; animation: eq-bar 6s ease-in-out infinite 0.5s; }
    .eq-4 { transform-origin: 127px 75px; animation: eq-bar 6s ease-in-out infinite 0.2s; }
    .eq-5 { transform-origin: 130px 75px; animation: eq-bar 6s ease-in-out infinite 0.4s; }
    .eq-6 { transform-origin: 133px 75px; animation: eq-bar 6s ease-in-out infinite 0.1s; }
    .cat-head { transform-origin: 80px 80px; animation: cat-breathe 7.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .left-ear, .right-ear, .steam-1, .steam-2, .eq-1, .eq-2, .eq-3, .eq-4, .eq-5, .eq-6, .cat-head {
        animation: none !important;
      }
    }
  </style>

  <!-- Background Warm Circle -->
  <circle cx="80" cy="80" r="76" fill="url(#lofi-bg)"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="#c6ad79" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Ambient Light Orbs -->
  <circle cx="36" cy="36" r="3" fill="#c6ad79" fill-opacity="0.25" filter="url(#cozy-glow)"/>
  <circle cx="124" cy="40" r="2" fill="#fed7aa" fill-opacity="0.3" filter="url(#cozy-glow)"/>

  <!-- Headphone Arc (Behind Head) -->
  <path d="M 32 75 A 50 50 0 0 1 128 75" fill="none" stroke="url(#headphone-band)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 36 75 A 46 46 0 0 1 124 75" fill="none" stroke="#064e3b" stroke-width="2"/>

  <!-- Cat Character -->
  <g class="cat-head">
    <!-- Cozy Knit Sweater Collar -->
    <path d="M 45 130 Q 80 148 115 130 Q 125 152 110 160 Q 80 160 50 160 Q 35 152 45 130 Z" fill="#b45309"/>
    <!-- Sweater Ribbing Stripes -->
    <path d="M 60 135 Q 80 144 100 135" fill="none" stroke="#d97706" stroke-width="2"/>
    <path d="M 55 142 Q 80 152 105 142" fill="none" stroke="#d97706" stroke-width="2"/>

    <!-- Left Ear -->
    <g class="left-ear">
      <polygon points="46,62 58,28 75,54" fill="url(#cat-fur)"/>
      <polygon points="51,58 59,35 70,52" fill="#fca5a5"/>
    </g>
    <!-- Right Ear -->
    <g class="right-ear">
      <polygon points="114,62 102,28 85,54" fill="url(#cat-fur)"/>
      <polygon points="109,58 101,35 90,52" fill="#fca5a5"/>
    </g>

    <!-- Cat Head Base -->
    <ellipse cx="80" cy="80" rx="38" ry="34" fill="url(#cat-fur)"/>
    <!-- Cheeks Fluff -->
    <path d="M 44 80 Q 38 88 48 94 Q 42 98 52 102" fill="none" stroke="url(#cat-fur)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 116 80 Q 122 88 112 94 Q 118 98 108 102" fill="none" stroke="url(#cat-fur)" stroke-width="4" stroke-linecap="round"/>

    <!-- Eyes (Contented Peaceful Focus) -->
    <path d="M 60 76 Q 66 82 72 76" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 88 76 Q 94 82 100 76" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Soft Cheerful Blush -->
    <ellipse cx="58" cy="84" rx="5" ry="3" fill="#bd8e9d" fill-opacity="0.35"/>
    <ellipse cx="102" cy="84" rx="5" ry="3" fill="#bd8e9d" fill-opacity="0.35"/>

    <!-- Cute Cat Nose & Mouth -->
    <polygon points="78,83 82,83 80,86" fill="#bd8e9d"/>
    <path d="M 76 87 Q 80 91 80 87 Q 80 91 84 87" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="42" y1="84" x2="32" y2="82" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="42" y1="88" x2="30" y2="90" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="118" y1="84" x2="128" y2="82" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="118" y1="88" x2="130" y2="90" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Left Headphone Earpad with Audio Equalizer -->
  <rect x="22" y="60" width="16" height="30" rx="8" fill="#047857"/>
  <rect x="24" y="62" width="12" height="26" rx="6" fill="#065f46"/>
  <!-- Equalizer Bars on Earpad -->
  <line x1="27" y1="72" x2="27" y2="78" stroke="#9abca9" stroke-width="1.5" stroke-linecap="round" class="eq-1"/>
  <line x1="30" y1="70" x2="30" y2="80" stroke="#9abca9" stroke-width="1.5" stroke-linecap="round" class="eq-2"/>
  <line x1="33" y1="73" x2="33" y2="77" stroke="#9abca9" stroke-width="1.5" stroke-linecap="round" class="eq-3"/>

  <!-- Right Headphone Earpad with Audio Equalizer -->
  <rect x="122" y="60" width="16" height="30" rx="8" fill="#047857"/>
  <rect x="124" y="62" width="12" height="26" rx="6" fill="#065f46"/>
  <!-- Equalizer Bars on Earpad -->
  <line x1="127" y1="73" x2="127" y2="77" stroke="#9abca9" stroke-width="1.5" stroke-linecap="round" class="eq-4"/>
  <line x1="130" y1="70" x2="130" y2="80" stroke="#9abca9" stroke-width="1.5" stroke-linecap="round" class="eq-5"/>
  <line x1="133" y1="72" x2="133" y2="78" stroke="#9abca9" stroke-width="1.5" stroke-linecap="round" class="eq-6"/>

  <!-- Steaming Matcha / Tea Mug in Corner -->
  <g transform="translate(104, 115)">
    <!-- Mug Body -->
    <rect x="0" y="8" width="22" height="20" rx="4" fill="#0f766e"/>
    <path d="M 22 12 Q 28 17 22 22" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="11" cy="8" rx="10" ry="3" fill="#14b8a6"/>
    <ellipse cx="11" cy="8" rx="8" ry="2" fill="#84cc16"/>
    <!-- Rising Animated Steam -->
    <path d="M 7 4 Q 5 -3 8 -8" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" class="steam-1"/>
    <path d="M 14 4 Q 17 -4 13 -10" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" class="steam-2"/>
  </g>

  <!-- Border Frame -->
  <circle cx="80" cy="80" r="76" fill="none" stroke="#85aa9b" stroke-opacity="0.35" stroke-width="2"/>
</svg>
