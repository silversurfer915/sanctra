<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="cyber-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#091426"/>
      <stop offset="60%" stop-color="#040914"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="cyber-visor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#9a87b4"/>
    </linearGradient>
    <linearGradient id="hud-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes hud-spin-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes hud-spin-ccw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes data-stream {
      0% { transform: translateX(-40px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(45px); opacity: 0; }
    }
    @keyframes circuit-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00f5d4); }
    }
    @keyframes scholar-breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .hud-outer { transform-origin: 80px 80px; animation: hud-spin-cw 36.0s linear infinite; }
    .hud-inner { transform-origin: 80px 80px; animation: hud-spin-ccw 25.2s linear infinite; }
    .data-line { animation: data-stream 6s linear infinite; }
    .circuit-node { animation: circuit-pulse 6s ease-in-out infinite; }
    .scholar-head { transform-origin: 80px 85px; animation: scholar-breathe 7.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .hud-outer, .hud-inner, .data-line, .circuit-node, .scholar-head {
        animation: none !important;
      }
    }
  </style>

  <!-- Deep Cyber Dark Void -->
  <circle cx="80" cy="80" r="76" fill="url(#cyber-bg)"/>

  <!-- Rotating Holographic HUD Reticle Rings -->
  <g class="hud-outer">
    <circle cx="80" cy="80" r="68" fill="none" stroke="url(#hud-ring-grad)" stroke-width="1.2" stroke-dasharray="14 18 30 12" stroke-opacity="0.6"/>
    <!-- Outer Compass Markers -->
    <rect x="78" y="8" width="4" height="6" fill="#00f5d4"/>
    <rect x="78" y="146" width="4" height="6" fill="#00f5d4"/>
    <rect x="8" y="78" width="6" height="4" fill="#00f5d4"/>
    <rect x="146" y="78" width="6" height="4" fill="#00f5d4"/>
  </g>

  <g class="hud-inner">
    <circle cx="80" cy="80" r="60" fill="none" stroke="#9fb9cc" stroke-width="1" stroke-dasharray="6 22 18 10" stroke-opacity="0.4"/>
    <circle cx="80" cy="20" r="2" fill="#00f5d4"/>
    <circle cx="140" cy="80" r="2" fill="#9a87b4"/>
  </g>

  <!-- Background Digital Grid Matrix Lines -->
  <line x1="20" y1="40" x2="140" y2="40" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="20" y1="80" x2="140" y2="80" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="20" y1="120" x2="140" y2="120" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="40" y1="20" x2="40" y2="140" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="20" x2="80" y2="140" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="120" y1="20" x2="120" y2="140" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Scholar Head & Jacket -->
  <g class="scholar-head">
    <!-- Tech Collar & Cyber Coat -->
    <path d="M 45 125 L 60 110 L 80 122 L 100 110 L 115 125 L 128 160 L 32 160 Z" fill="#0f172a"/>
    <path d="M 60 110 L 80 122 L 100 110" fill="none" stroke="#00f5d4" stroke-width="2"/>
    <line x1="80" y1="122" x2="80" y2="160" stroke="#0284c7" stroke-width="2"/>

    <!-- Neck & Jaw -->
    <rect x="68" y="100" width="24" height="18" fill="#1e293b"/>
    <polygon points="56,70 56,102 80,116 104,102 104,70" fill="#334155"/>

    <!-- Sleek Futuristic Hair / Hood -->
    <path d="M 48 72 C 46 45 60 34 80 34 C 100 34 114 45 112 72 L 114 85 L 106 82 L 104 60 C 100 48 90 42 80 42 C 70 42 60 48 56 60 L 54 82 L 46 85 Z" fill="#1e293b"/>
    <path d="M 52 50 Q 80 32 108 50" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Glowing Cybernetic Ear Implant / Headset -->
    <rect x="42" y="68" width="10" height="20" rx="4" fill="#0f172a" stroke="#00f5d4" stroke-width="1.5"/>
    <circle cx="47" cy="78" r="2.5" fill="#00f5d4" class="circuit-node"/>
    <rect x="108" y="68" width="10" height="20" rx="4" fill="#0f172a" stroke="#00f5d4" stroke-width="1.5"/>
    <circle cx="113" cy="78" r="2.5" fill="#00f5d4" class="circuit-node"/>

    <!-- Circuit Trace Lines on Jaw -->
    <polyline points="60,94 68,98 72,106" fill="none" stroke="#00f5d4" stroke-width="1.2" stroke-linecap="round" class="circuit-node"/>
    <polyline points="100,94 92,98 88,106" fill="none" stroke="#9a87b4" stroke-width="1.2" stroke-linecap="round" class="circuit-node"/>

    <!-- Holographic Cyber Visor Glass -->
    <g>
      <rect x="46" y="62" width="68" height="22" rx="6" fill="#030712" stroke="url(#cyber-visor)" stroke-width="2"/>
      <rect x="48" y="64" width="64" height="18" rx="4" fill="url(#cyber-visor)" fill-opacity="0.3" filter="url(#neon-glow)"/>

      <!-- Scrolling Binary / Digital Data Stream in Visor -->
      <g clip-path="url(#cyber-clip)">
        <clipPath id="cyber-clip">
          <rect x="48" y="64" width="64" height="18" rx="4"/>
        </clipPath>
        <!-- Data glyphs -->
        <g class="data-line">
          <text x="50" y="77" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="2">01101 · FOCUS · 1011</text>
        </g>
      </g>
    </g>

    <!-- Holographic Floating Target Crosshair on Right Visor Edge -->
    <circle cx="102" cy="73" r="4" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="96" y1="73" x2="108" y2="73" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="102" y1="67" x2="102" y2="79" stroke="#ffffff" stroke-width="0.8"/>
  </g>

  <!-- Border Ring -->
  <circle cx="80" cy="80" r="76" fill="none" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="2"/>
</svg>
