<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="kitsune-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="60%" stop-color="#0e071c"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>
    <linearGradient id="fox-fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="spirit-flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#83aab8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="spirit-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes tail-sway-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes tail-sway-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes wisp-float-1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(6px, -12px) scale(1.2); opacity: 1; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
    }
    @keyframes wisp-float-2 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      50% { transform: translate(-8px, -10px) scale(1.25); opacity: 1; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
    }
    @keyframes crest-pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #9fb9cc); }
    }
    @keyframes eye-glow {
      0%, 100% { filter: drop-shadow(0 0 2px #83aab8); }
      50% { filter: drop-shadow(0 0 6px #9fbfc9); }
    }
    .left-tail { transform-origin: 50px 130px; animation: tail-sway-left 9.0s ease-in-out infinite; }
    .right-tail { transform-origin: 110px 130px; animation: tail-sway-right 8.1s ease-in-out infinite 0.5s; }
    .wisp-left { animation: wisp-float-1 6.48s ease-in-out infinite; }
    .wisp-right { animation: wisp-float-2 7.5600000000000005s ease-in-out infinite 1s; }
    .wisp-top { animation: wisp-float-1 6s ease-in-out infinite 0.7s; }
    .forehead-mark { transform-origin: 80px 65px; animation: crest-pulse 6s ease-in-out infinite; }
    .spirit-eyes { animation: eye-glow 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .left-tail, .right-tail, .wisp-left, .wisp-right, .wisp-top, .forehead-mark, .spirit-eyes {
        animation: none !important;
      }
    }
  </style>

  <!-- Background -->
  <circle cx="80" cy="80" r="76" fill="url(#kitsune-bg)"/>
  <circle cx="80" cy="80" r="66" fill="none" stroke="#8b5cf6" stroke-opacity="0.25" stroke-dasharray="4 6" stroke-width="1.5"/>

  <!-- Left Swaying Fluffy Tail -->
  <path d="M 50 130 C 20 120 15 85 30 70 C 42 75 48 95 55 125 Z" fill="url(#fox-fur)" class="left-tail"/>
  <path d="M 28 72 C 34 78 40 85 45 95 C 38 90 32 82 28 72 Z" fill="#a3aaca" fill-opacity="0.5" class="left-tail"/>

  <!-- Right Swaying Fluffy Tail -->
  <path d="M 110 130 C 140 120 145 85 130 70 C 118 75 112 95 105 125 Z" fill="url(#fox-fur)" class="right-tail"/>
  <path d="M 132 72 C 126 78 120 85 115 95 C 122 90 128 82 132 72 Z" fill="#a3aaca" fill-opacity="0.5" class="right-tail"/>

  <!-- Kitsunebi / Spirit Wisps Floating Around -->
  <!-- Left Spirit Wisp -->
  <g class="wisp-left" transform="translate(24, 52)">
    <circle cx="0" cy="0" r="10" fill="url(#spirit-flame)" filter="url(#spirit-glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
  <!-- Right Spirit Wisp -->
  <g class="wisp-right" transform="translate(136, 56)">
    <circle cx="0" cy="0" r="11" fill="url(#spirit-flame)" filter="url(#spirit-glow)"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
  </g>
  <!-- Top Center Spirit Wisp -->
  <g class="wisp-top" transform="translate(80, 20)">
    <circle cx="0" cy="0" r="8" fill="url(#spirit-flame)" filter="url(#spirit-glow)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Fox Body / Kimono Robe -->
  <path d="M 50 125 Q 80 145 110 125 L 120 160 L 40 160 Z" fill="#312e81"/>
  <!-- Robe Golden Embellishment -->
  <path d="M 64 128 L 80 148 L 96 128" fill="none" stroke="#c6ad79" stroke-width="2.5"/>
  <circle cx="80" cy="150" r="3.5" fill="#b89b6b"/>

  <!-- Fox Ears -->
  <!-- Left Ear -->
  <polygon points="46,65 52,22 78,54" fill="url(#fox-fur)"/>
  <polygon points="52,60 55,30 72,52" fill="#4338ca"/>
  <polygon points="54,58 57,36 68,52" fill="#a3aaca"/>
  <!-- Right Ear -->
  <polygon points="114,65 108,22 82,54" fill="url(#fox-fur)"/>
  <polygon points="108,60 105,30 88,52" fill="#4338ca"/>
  <polygon points="106,58 103,36 92,52" fill="#a3aaca"/>

  <!-- Fox Head Shape -->
  <path d="M 44 72 C 40 92 65 116 80 120 C 95 116 120 92 116 72 C 114 55 46 55 44 72 Z" fill="url(#fox-fur)"/>

  <!-- Cheek Tufts -->
  <polygon points="42,78 32,84 46,88" fill="url(#fox-fur)"/>
  <polygon points="44,88 34,94 48,97" fill="url(#fox-fur)"/>
  <polygon points="118,78 128,84 114,88" fill="url(#fox-fur)"/>
  <polygon points="116,88 126,94 112,97" fill="url(#fox-fur)"/>

  <!-- Red/Vermilion Traditional Kitsune Face Markings -->
  <path d="M 52 82 Q 62 86 68 83" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 108 82 Q 98 86 92 83" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 50 88 Q 58 92 64 90" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 110 88 Q 102 92 96 90" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Forehead Celestial Gem Mark (Animated) -->
  <g class="forehead-mark">
    <polygon points="80,56 84,65 80,74 76,65" fill="#b89b6b"/>
    <circle cx="80" cy="65" r="2.5" fill="#9fb9cc"/>
  </g>

  <!-- Glowing Cyan Spirit Eyes -->
  <g class="spirit-eyes">
    <ellipse cx="64" cy="78" rx="6" ry="3.5" fill="#83aab8" transform="rotate(-8 64 78)"/>
    <ellipse cx="64" cy="78" rx="4" ry="2" fill="#e0f2fe" transform="rotate(-8 64 78)"/>
    <ellipse cx="96" cy="78" rx="6" ry="3.5" fill="#83aab8" transform="rotate(8 96 78)"/>
    <ellipse cx="96" cy="78" rx="4" ry="2" fill="#e0f2fe" transform="rotate(8 96 78)"/>
  </g>

  <!-- Fox Nose & Refined Snout -->
  <polygon points="78,102 82,102 80,105" fill="#1e1b4b"/>
  <path d="M 77 106 Q 80 109 83 106" fill="none" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Border Frame -->
  <circle cx="80" cy="80" r="76" fill="none" stroke="#9a87b4" stroke-opacity="0.4" stroke-width="2"/>
</svg>
