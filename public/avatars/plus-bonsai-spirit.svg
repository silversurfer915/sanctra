<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="zen-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#14241d"/>
      <stop offset="60%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#030805"/>
    </radialGradient>
    <linearGradient id="trunk-bark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#270e02"/>
    </linearGradient>
    <radialGradient id="foliage-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#85aa9b"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="firefly-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="80%" stop-color="#85aa9b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#85aa9b" stop-opacity="0"/>
    </radialGradient>
    <filter id="zen-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes island-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes petal-drift-1 {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.8; }
      100% { transform: translate(25px, 35px) rotate(120deg); opacity: 0; }
    }
    @keyframes petal-drift-2 {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      25% { opacity: 0.9; }
      85% { opacity: 0.8; }
      100% { transform: translate(22px, 30px) rotate(-90deg); opacity: 0; }
    }
    @keyframes firefly-bob-1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(-6px, -8px) scale(1.3); opacity: 1; }
    }
    @keyframes firefly-bob-2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(8px, -6px) scale(1.25); opacity: 1; }
    }
    .floating-island { transform-origin: 80px 95px; animation: island-float 9.0s ease-in-out infinite; }
    .petal-1 { animation: petal-drift-1 6.84s ease-in-out infinite; }
    .petal-2 { animation: petal-drift-2 7.5600000000000005s ease-in-out infinite 1.2s; }
    .petal-3 { animation: petal-drift-1 8.1s ease-in-out infinite 2.2s; }
    .ff-1 { animation: firefly-bob-1 6s ease-in-out infinite; }
    .ff-2 { animation: firefly-bob-2 6.84s ease-in-out infinite 0.8s; }
    .ff-3 { animation: firefly-bob-1 6s ease-in-out infinite 1.6s; }
    @media (prefers-reduced-motion: reduce) {
      .floating-island, .petal-1, .petal-2, .petal-3, .ff-1, .ff-2, .ff-3 {
        animation: none !important;
      }
    }
  </style>

  <!-- Deep Forest Void -->
  <circle cx="80" cy="80" r="76" fill="url(#zen-bg)"/>

  <!-- Moon / Sun Disk in Background -->
  <circle cx="80" cy="52" r="30" fill="#fef3c7" fill-opacity="0.12"/>
  <circle cx="80" cy="52" r="24" fill="#fef3c7" fill-opacity="0.15"/>

  <!-- Ambient Glowing Fireflies -->
  <g class="ff-1" transform="translate(36, 52)">
    <circle cx="0" cy="0" r="6" fill="url(#firefly-glow)" filter="url(#zen-glow)"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
  <g class="ff-2" transform="translate(125, 45)">
    <circle cx="0" cy="0" r="7" fill="url(#firefly-glow)" filter="url(#zen-glow)"/>
    <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
  </g>
  <g class="ff-3" transform="translate(90, 28)">
    <circle cx="0" cy="0" r="5" fill="url(#firefly-glow)" filter="url(#zen-glow)"/>
    <circle cx="0" cy="0" r="1.3" fill="#ffffff"/>
  </g>

  <!-- Drifting Sakura Blossoms / Petals -->
  <g class="petal-1" transform="translate(55, 42)">
    <path d="M 0 0 C -2 -4 -6 -3 -6 0 C -6 3 -2 5 0 7 C 2 5 6 3 6 0 C 6 -3 2 -4 0 0 Z" fill="#d4afc6" transform="scale(0.8)"/>
  </g>
  <g class="petal-2" transform="translate(75, 50)">
    <path d="M 0 0 C -2 -4 -6 -3 -6 0 C -6 3 -2 5 0 7 C 2 5 6 3 6 0 C 6 -3 2 -4 0 0 Z" fill="#fbcfe8" transform="scale(0.7)"/>
  </g>
  <g class="petal-3" transform="translate(92, 46)">
    <path d="M 0 0 C -2 -4 -6 -3 -6 0 C -6 3 -2 5 0 7 C 2 5 6 3 6 0 C 6 -3 2 -4 0 0 Z" fill="#d4afc6" transform="scale(0.85)"/>
  </g>

  <!-- Floating Island with Bonsai Tree -->
  <g class="floating-island">
    <!-- Floating Mossy Rock Island Foundation -->
    <path d="M 35 118 C 30 135 60 152 80 155 C 100 152 130 135 125 118 Z" fill="#1e293b"/>
    <path d="M 40 120 C 45 132 65 142 80 144 C 95 142 115 132 120 120 Z" fill="#334155"/>
    <!-- Hanging Moss Tendrils -->
    <path d="M 52 124 Q 50 138 54 142" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 78 126 Q 80 142 76 146" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 104 124 Q 106 136 102 140" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Lush Top Moss & Stone Rim -->
    <ellipse cx="80" cy="118" rx="46" ry="12" fill="#047857"/>
    <ellipse cx="80" cy="116" rx="44" ry="10" fill="#059669"/>
    <ellipse cx="80" cy="115" rx="40" ry="8" fill="#85aa9b"/>

    <!-- Ancient Gnarled Bonsai Trunk -->
    <!-- Roots gripping stone -->
    <path d="M 68 116 C 65 112 60 115 54 118" fill="none" stroke="url(#trunk-bark)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 90 116 C 94 112 100 115 106 118" fill="none" stroke="url(#trunk-bark)" stroke-width="5" stroke-linecap="round"/>

    <!-- S-Curve Gnarled Trunk -->
    <path d="M 78 116 C 75 105 84 96 82 85 C 80 76 72 72 74 62" fill="none" stroke="url(#trunk-bark)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 78 116 C 75 105 84 96 82 85 C 80 76 72 72 74 62" fill="none" stroke="#a16207" stroke-width="2" stroke-linecap="round"/>

    <!-- Branches -->
    <path d="M 82 88 C 94 84 104 88 112 84" fill="none" stroke="url(#trunk-bark)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 78 74 C 64 70 54 74 46 72" fill="none" stroke="url(#trunk-bark)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 74 62 C 68 54 62 52 56 50" fill="none" stroke="url(#trunk-bark)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 74 62 C 82 54 90 52 96 50" fill="none" stroke="url(#trunk-bark)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Tiered Cloud-Pruned Foliage Pads (Niwaki) -->
    <!-- Left Lower Cloud -->
    <ellipse cx="46" cy="70" rx="18" ry="10" fill="url(#foliage-grad)"/>
    <ellipse cx="44" cy="68" rx="14" ry="7" fill="#9abca9"/>
    <!-- Right Mid Cloud -->
    <ellipse cx="112" cy="82" rx="20" ry="11" fill="url(#foliage-grad)"/>
    <ellipse cx="114" cy="80" rx="15" ry="8" fill="#9abca9"/>
    <!-- Left High Cloud -->
    <ellipse cx="56" cy="48" rx="16" ry="9" fill="url(#foliage-grad)"/>
    <ellipse cx="54" cy="46" rx="12" ry="6" fill="#9abca9"/>
    <!-- Right High Cloud -->
    <ellipse cx="98" cy="48" rx="17" ry="10" fill="url(#foliage-grad)"/>
    <ellipse cx="100" cy="46" rx="13" ry="7" fill="#9abca9"/>
    <!-- Top Crown Cloud -->
    <ellipse cx="76" cy="38" rx="22" ry="12" fill="url(#foliage-grad)"/>
    <ellipse cx="76" cy="36" rx="17" ry="8" fill="#9abca9"/>
    <ellipse cx="76" cy="34" rx="11" ry="5" fill="#a7f3d0"/>

    <!-- Tiny Stone Lantern (Tōrō) on Island -->
    <g transform="translate(106, 102)">
      <rect x="0" y="8" width="8" height="3" rx="1" fill="#64748b"/>
      <rect x="2" y="4" width="4" height="4" fill="#94a3b8"/>
      <rect x="1" y="2" width="6" height="3" rx="1" fill="#fef08a" filter="url(#zen-glow)"/>
      <polygon points="4,-1 -1,2 9,2" fill="#475569"/>
    </g>
  </g>

  <!-- Border Ring -->
  <circle cx="80" cy="80" r="76" fill="none" stroke="#85aa9b" stroke-opacity="0.4" stroke-width="2"/>
</svg>
