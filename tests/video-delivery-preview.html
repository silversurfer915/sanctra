<!doctype html><html><head><title>Video delivery check</title><style>body{background:#18202a;color:white;font:16px system-ui}video{width:30%;}output{display:block;white-space:pre-wrap}</style></head><body><h1>Video delivery check</h1><video id="local" muted autoplay loop playsinline src="/backgrounds/video/stream-still.mp4"></video><video id="domain" muted autoplay loop playsinline src="https://sanctrastudy.live/backgrounds/video/stream-still.mp4"></video><video id="origin" muted autoplay loop playsinline src="https://studyapp-4137d.web.app/backgrounds/video/stream-still.mp4"></video><output></output><script>const history=[];document.querySelectorAll('video').forEach(v=>{for(const e of ['loadstart','waiting','stalled','abort','error','playing','ended'])v.addEventListener(e,()=>history.push(v.id+': '+e+' @ '+v.currentTime.toFixed(2)));});setInterval(()=>document.querySelector('output').textContent=JSON.stringify([...document.querySelectorAll('video')].map(v=>({id:v.id,t:v.currentTime,ready:v.readyState,network:v.networkState,buffer:v.buffered.length?v.buffered.end(v.buffered.length-1):0,error:v.error?.message})),null,2)+'\n'+history.slice(-20).join('\n'),1000);</script></body></html>
